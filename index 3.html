<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Quote Card Maker</title>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;800&family=Playfair+Display:wght@800&display=swap" rel="stylesheet">
<style>
  :root { --bg:#f1ebdf; --ink:#0b1220; --blue:#5b9bd5; --brand:#1b5fb4; --panel:#ffffff; --line:#d9d2c3; --page:#e7e2d8; }
  @media (prefers-color-scheme: dark) {
    :root { --panel:#1c2230; --line:#343c50; --page:#10141d; --ctl:#e8ecf4; }
  }
  * { box-sizing: border-box; }
  body { margin:0; font-family: Montserrat, system-ui, sans-serif; background:var(--page); color:var(--ctl, #14181f); }
  .app { max-width: 1100px; margin: 0 auto; padding: 16px; display:grid; gap:16px; }
  @media (min-width: 900px) { .app { grid-template-columns: 340px 1fr; align-items:start; } }
  .panel { background:var(--panel); border:1px solid var(--line); border-radius:12px; padding:16px; display:grid; gap:12px; }
  label { font-size:13px; font-weight:600; display:grid; gap:6px; }
  select { font:inherit; font-size:15px; padding:10px; border:1px solid var(--line); border-radius:8px; background:transparent; color:inherit; width:100%; }
  select option { color:#14181f; }
  textarea, input { font:inherit; font-size:15px; padding:10px; border:1px solid var(--line); border-radius:8px; background:transparent; color:inherit; width:100%; }
  textarea { min-height:150px; resize:vertical; line-height:1.4; }
  .hint { font-size:12px; opacity:.75; margin:0; line-height:1.4; }
  button { font:inherit; font-weight:600; font-size:15px; padding:12px 16px; border:0; border-radius:8px; background:#1b5fb4; color:#fff; cursor:pointer; }
  button:focus-visible, textarea:focus-visible, input:focus-visible { outline:3px solid #f0a500; outline-offset:2px; }

  .stage { width:100%; aspect-ratio:1/1; overflow:hidden; border-radius:8px; }
  .scaler { width:1080px; height:1080px; transform-origin: top left; }

  /* ---- the card (1080 x 1080) ---- */
  #card { position:relative; width:1080px; height:1080px; overflow:hidden; background: var(--bg); color:#0b1220; font-family: Montserrat, sans-serif; }
  #card .sky { position:absolute; inset:0; background:
      radial-gradient(ellipse at 55% 80%, rgba(255,196,120,.55), transparent 55%),
      linear-gradient(#f3ecdf 0%, #f1e6d3 60%, #f0d9b8 100%); }
  #card .grain { position:absolute; inset:0; opacity:.35; mix-blend-mode:multiply;
      background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='200' height='200'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='2'/><feColorMatrix values='0 0 0 0 .5  0 0 0 0 .45  0 0 0 0 .35  0 0 0 .25 0'/></filter><rect width='200' height='200' filter='url(%23n)'/></svg>"); }
  #card svg.scene { position:absolute; left:0; bottom:0; width:100%; height:430px; }

  #card .photo, #card .wash { position:absolute; inset:0; display:none; }
  #card .photo { background-size:cover; background-position:center bottom; }
  #card .wash { background: linear-gradient(to bottom, rgba(244,238,226,var(--wash,.85)) 0%, rgba(244,238,226,calc(var(--wash,.85)*.9)) 60%, rgba(244,238,226,0) 74%, rgba(7,13,24,.55) 82%, rgba(7,13,24,.92) 100%); }
  #card.has-photo .photo, #card.has-photo .wash { display:block; }
  #card.has-photo .sky, #card.has-photo svg.scene { display:none; }
  #card.builtin .wash { display:none; }
  .file { font-weight:600; }
  .row { display:flex; gap:8px; }
  .row button { flex:1; }
  button.alt { background:transparent; color:inherit; border:1px solid var(--line); }
  #result { position:fixed; inset:0; z-index:99; background:rgba(5,8,14,.94); display:none; flex-direction:column; align-items:center; gap:12px; padding:16px; overflow:auto; color:#fff; }
  #result.on { display:flex; }
  #result img { max-width:min(100%,560px); border-radius:8px; -webkit-touch-callout:default; }
  #result p { margin:0; font-size:14px; text-align:center; max-width:420px; line-height:1.4; }
  #result .row { width:100%; max-width:420px; }
  .logo { position:absolute; top:34px; left:0; right:0; text-align:center; }
  .logo svg { width:136px; height:auto; }
  .brand { position:absolute; top:160px; left:0; right:0; text-align:center; font-weight:600; font-size:41px; letter-spacing:.34em; padding-left:.34em; }
  .tag { position:absolute; top:212px; left:0; right:0; display:flex; align-items:center; justify-content:center; gap:16px; font-size:13.5px; letter-spacing:.28em; font-weight:500; }
  .tag::before, .tag::after { content:""; height:2px; width:62px; background:#0b1220; }

  .quote { position:absolute; top:268px; left:60px; right:60px; text-align:center; font-family:'Playfair Display', Georgia, serif; font-weight:800; font-size:68px; line-height:1.17; letter-spacing:-.01em; }
  .quote .ln { display:block; }
  .quote .hl { position:relative; display:inline-block; padding:0 26px; margin:2px 0; z-index:0; }
  .quote .hl::before { content:""; position:absolute; left:0; right:0; top:8%; bottom:4%; z-index:-1; background:var(--blue); opacity:.9;
      clip-path: polygon(1% 18%, 4% 4%, 12% 12%, 30% 2%, 55% 8%, 80% 0, 96% 10%, 99% 30%, 100% 52%, 97% 78%, 98% 94%, 80% 100%, 55% 94%, 30% 100%, 8% 92%, 3% 98%, 0 72%, 2% 46%); }

  .attr { position:absolute; top:760px; left:0; right:0; display:flex; align-items:center; justify-content:center; gap:14px; font-size:15.5px; letter-spacing:.3em; font-weight:500; }
  .attr::before, .attr::after { content:""; width:30px; height:2px; background:#0b1220; }

  .follow { position:absolute; left:0; right:0; bottom:176px; display:flex; align-items:center; justify-content:center; gap:22px; color:#f4efe6; font-size:16px; letter-spacing:.3em; font-weight:500; }
  .follow::before, .follow::after { content:""; height:1px; width:110px; background:rgba(244,239,230,.7); }
  .cats { position:absolute; left:60px; right:60px; bottom:56px; display:flex; justify-content:space-between; color:#f4efe6; }
  .cat { flex:1; display:flex; flex-direction:column; align-items:center; gap:10px; font-size:12.5px; letter-spacing:.2em; font-weight:500; position:relative; }
  .cat + .cat::before { content:""; position:absolute; left:0; top:4px; height:44px; width:1px; background:rgba(244,239,230,.45); }
  .cat svg { width:34px; height:34px; stroke:#f4efe6; fill:none; stroke-width:1.6; stroke-linecap:round; stroke-linejoin:round; }
  .social { position:absolute; left:0; right:0; bottom:14px; display:flex; justify-content:center; align-items:center; gap:18px; color:#f4efe6; font-size:14.5px; letter-spacing:.28em; font-weight:500; }
  .social svg { width:22px; height:22px; fill:#f4efe6; }
  .social .bar { width:1px; height:26px; background:rgba(244,239,230,.5); }
</style>
</head>
<body>
<div class="app">
  <div class="panel">
    <label>Quote
      <textarea id="quote">Nobody is coming to save you. Build the discipline to become the person you have been waiting for.</textarea>
    </label>
    <p class="hint">Just paste your quote. Line breaks and blue highlights are added automatically.</p>
    <label>Brand name <input id="brand" value="RISE THEORY"></label>
    <label>Tagline <input id="tagline" value="CHANGE YOUR MIND. CHANGE YOUR LIFE."></label>
    <label>Attribution <input id="attr" value="RISE THEORY"></label>
    <label>Footer handle <input id="handle" value="RISE THEORY"></label>
    <label>Download size
      <select id="size">
        <option value="square">Square 1080 × 1080 (Instagram, Facebook)</option>
        <option value="portrait">Portrait 1080 × 1350 (Instagram, Facebook feed)</option>
        <option value="vertical">Vertical 1080 × 1920 (YouTube Shorts, TikTok, Reels, Stories)</option>
      </select>
    </label>
    <button id="dl">Download PNG</button>
    <p class="hint">Edits update the card live. The download is 2160 × 2160.</p>
  </div>

  <div class="stage" id="stage">
    <div class="scaler" id="scaler">
      <div id="card" class="has-photo builtin">

<script>
  const $ = id => document.getElementById(id);
  const esc = s => s.replace(/[&<>]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));


  // Auto layout: balanced line breaks + highlight the key lines.
  function layout(raw) {
    let text = raw.replace(/^[\s"\u201C\u201D]+|[\s"\u201C\u201D]+$/g, '');
    // manual override: lines wrapped in ==...==
    if (text.includes('==')) {
      return text.split('\n').filter(l => l.trim()).map(l => {
        const m = l.trim().match(/^==(.*)==$/);
        return { text: m ? m[1] : l.trim(), hl: !!m };
      });
    }
    text = text.replace(/\s+/g, ' ');
    if (!text) return [];
    const sentences = text.match(/[^.!?]+[.!?]*/g).map(x => x.trim()).filter(Boolean);
    const MAX = 26;
    const wrap = str => {
      const ws = str.split(' ');
      const n = Math.max(1, Math.ceil(str.length / MAX));
      const target = str.length / n;
      const res = []; let cur = '';
      ws.forEach(w => {
        if (cur && cur.length + 1 + w.length > target + 2 && res.length < n - 1) { res.push(cur); cur = w; }
        else cur = cur ? cur + ' ' + w : w;
      });
      if (cur) res.push(cur);
      return res;
    };
    let out = [];
    sentences.forEach((sen, si) => wrap(sen).forEach(t => out.push({ text: t, si, hl: false })));
    // single sentence: split it in half so there is something to highlight
    let keyIdx;
    if (sentences.length > 1) keyIdx = out.map((l, i) => l.si === sentences.length - 1 ? i : -1).filter(i => i >= 0);
    else keyIdx = out.map((l, i) => i).filter(i => i >= Math.floor(out.length / 2));
    if (keyIdx.length <= 2) keyIdx.forEach(i => out[i].hl = true);
    else keyIdx.forEach((i, k) => { out[i].hl = !(k === 1 && keyIdx.length === 3) && !(k % 2 === 1 && keyIdx.length > 3 && k !== keyIdx.length - 1); });
    return out;
  }

  function render() {
    $('o-brand').textContent = $('brand').value;
    $('o-tag').textContent = $('tagline').value;
    $('o-attr').textContent = $('attr').value;
    $('o-follow').textContent = 'FOLLOW ' + $('handle').value + ' FOR MORE';
    $('o-handle').textContent = $('handle').value;

    const lines = layout($('quote').value);
    const html = lines.map((l, i) => {
      let t = l.text;
      if (i === 0) t = '\u201C' + t;
      if (i === lines.length - 1) t = t + '\u201D';
      const inner = esc(t);
      return `<span class="ln">${l.hl ? `<span class="hl">${inner}</span>` : inner}</span>`;
    }).join('');
    $('o-quote').innerHTML = html;
    fit();
  }

  // shrink quote font if it would collide with the attribution line
  function fit() {
    const q = $('o-quote'); let size = 68; q.style.fontSize = size + 'px';
    while (q.offsetHeight > 480 && size > 30) { size -= 2; q.style.fontSize = size + 'px'; }
  }

  function scale() {
    const w = $('stage').clientWidth;
    $('scaler').style.transform = `scale(${w / 1080})`;
  }

  ['quote','brand','tagline','attr','handle'].forEach(id => $(id).addEventListener('input', render));
  window.addEventListener('resize', scale);
  (document.fonts ? document.fonts.ready : Promise.resolve()).then(() => { render(); scale(); });
  render(); scale();


  /* ---- Download: draw the card straight onto a canvas (works on iPhone) ---- */
  const loadImg = src => new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = rej; i.src = src; });

  const SIZES = {
    square:   { w: 1080, h: 1080, P: 0,   topDy: 0,   footDy: 0 },
    portrait: { w: 1080, h: 1350, P: 270, topDy: 150, footDy: 270 },
    vertical: { w: 1080, h: 1920, P: 510, topDy: 306, footDy: 510 }
  };

  async function renderCard(cfg) {
    await document.fonts.ready;
    await Promise.all(['800 68px "Playfair Display"','600 40px Montserrat','500 14px Montserrat'].map(f => document.fonts.load(f).catch(() => {})));
    const K = 2, W = cfg.w, H = cfg.h, P = cfg.P;
    const cv = document.createElement('canvas'); cv.width = W * K; cv.height = H * K;
    const ctx = cv.getContext('2d'); ctx.scale(K, K);
    const card = $('card'), cr = card.getBoundingClientRect(), s = cr.width / 1080;
    const rc = r => ({ x: (r.left - cr.left) / s, y: (r.top - cr.top) / s, w: r.width / s, h: r.height / s });

    // background: photo at the bottom, extended upward (and downward) by mirroring
    const m = $('photo').style.backgroundImage.match(/url\(["']?(.+?)["']?\)$/);
    ctx.fillStyle = '#f1ebdf'; ctx.fillRect(0, 0, W, H);
    if (m) {
      const im = await loadImg(m[1]), k = im.height / 1080, T = 300;
      ctx.drawImage(im, 0, P, 1080, 1080);
      const tile = (dy, sy, flip, T) => {
        ctx.save();
        if (flip) { ctx.translate(0, dy + T); ctx.scale(1, -1); ctx.drawImage(im, 0, sy * k, im.width, T * k, 0, 0, 1080, T); }
        else ctx.drawImage(im, 0, sy * k, im.width, T * k, 0, dy, 1080, T);
        ctx.restore();
      };
      let y = P, flip = true;
      while (y > 0) { y -= T; tile(y, 0, flip, T); flip = !flip; }
      y = P + 1080; flip = true;
      const TB = 100;
      while (y < H) { tile(y, 1080 - TB, flip, TB); y += TB; flip = !flip; }
      if (H > P + 1080) { const g = ctx.createLinearGradient(0, P + 1080 - 40, 0, P + 1080 + 120); g.addColorStop(0, 'rgba(6,12,22,0)'); g.addColorStop(1, 'rgba(6,12,22,0.96)'); ctx.fillStyle = g; ctx.fillRect(0, P + 1080 - 40, W, H - (P + 1080 - 40)); }
    }

    // text nodes grouped into top (logo/quote) and footer
    const tw = document.createTreeWalker(card, NodeFilter.SHOW_TEXT), nodes = [];
    let n; while ((n = tw.nextNode())) { if (n.textContent.trim() && !n.parentElement.closest('svg')) nodes.push(n); }
    const isFoot = el => !!el.closest('.follow, .cats, .social');
    const drawText = list => list.forEach(n => {
      const el = n.parentElement, cs = getComputedStyle(el);
      const rg = document.createRange(); rg.selectNodeContents(n);
      const rects = rg.getClientRects(); if (!rects.length) return;
      const r = rc(rects[0]), text = n.textContent.replace(/\s+/g, ' ').trim();
      ctx.font = `${cs.fontWeight} ${cs.fontSize} ${cs.fontFamily}`;
      ctx.fillStyle = cs.color; ctx.textBaseline = 'alphabetic';
      const asc = ctx.measureText('Mg').fontBoundingBoxAscent || parseFloat(cs.fontSize) * 0.9;
      const base = r.y + asc, ls = parseFloat(cs.letterSpacing) || 0;
      if (ls) { let x = r.x; for (const ch of text) { ctx.fillText(ch, x, base); x += ctx.measureText(ch).width + ls; } }
      else ctx.fillText(text, r.x, base);
    });
    const sideLines = (sel, gap, len, h, color) => {
      const el = document.querySelector(sel), t = document.createTreeWalker(el, NodeFilter.SHOW_TEXT), arr = [];
      let q; while ((q = t.nextNode())) if (q.textContent.trim()) arr.push(q);
      const a = document.createRange(); a.selectNodeContents(arr[0]);
      const b = document.createRange(); b.selectNodeContents(arr[arr.length - 1]);
      const ra = rc(a.getClientRects()[0]), rb = rc(b.getClientRects()[0]);
      const y = ra.y + ra.h / 2 - h / 2; ctx.fillStyle = color;
      ctx.fillRect(ra.x - gap - len, y, len, h); ctx.fillRect(rb.x + rb.w + gap, y, len, h);
    };

    // ---- top group ----
    ctx.save(); ctx.translate(0, cfg.topDy);
    const lg = document.querySelector('.logo svg'), lr = rc(lg.getBoundingClientRect()), k2 = lr.w / 160;
    ctx.save(); ctx.translate(lr.x, lr.y); ctx.scale(k2, k2);
    ctx.fillStyle = '#0b1220'; ctx.font = '800 150px Montserrat'; ctx.textBaseline = 'alphabetic';
    const rw = ctx.measureText('R').width;
    ctx.save(); ctx.scale(118 / rw, 1); ctx.fillText('R', 0, 122); ctx.restore();
    ctx.fillStyle = '#1b5fb4'; ctx.beginPath();
    [[118,124],[118,30],[104,30],[128,2],[152,30],[138,30],[138,124]].forEach((p, i) => i ? ctx.lineTo(p[0], p[1]) : ctx.moveTo(p[0], p[1]));
    ctx.closePath(); ctx.fill(); ctx.restore();
    const poly = [[1,18],[4,4],[12,12],[30,2],[55,8],[80,0],[96,10],[99,30],[100,52],[97,78],[98,94],[80,100],[55,94],[30,100],[8,92],[3,98],[0,72],[2,46]];
    document.querySelectorAll('#o-quote .hl').forEach(el => {
      const r = rc(el.getBoundingClientRect()), by = r.y + r.h * 0.08, bh = r.h * 0.88;
      ctx.fillStyle = 'rgba(91,155,213,0.9)'; ctx.beginPath();
      poly.forEach((p, i) => { const x = r.x + r.w * p[0] / 100, y = by + bh * p[1] / 100; i ? ctx.lineTo(x, y) : ctx.moveTo(x, y); });
      ctx.closePath(); ctx.fill();
    });
    drawText(nodes.filter(n => !isFoot(n.parentElement)));
    sideLines('#o-tag', 16, 62, 2, '#0b1220');
    sideLines('#o-attr', 14, 30, 2, '#0b1220');
    ctx.restore();

    // ---- footer group ----
    ctx.save(); ctx.translate(0, cfg.footDy);
    drawText(nodes.filter(n => isFoot(n.parentElement)));
    sideLines('.follow', 22, 110, 1, 'rgba(244,239,230,0.7)');
    document.querySelectorAll('.cat + .cat').forEach(c => { const r = rc(c.getBoundingClientRect()); ctx.fillStyle = 'rgba(244,239,230,0.45)'; ctx.fillRect(r.x, r.y + 4, 1, 44); });
    const bar = rc(document.querySelector('.social .bar').getBoundingClientRect());
    ctx.fillStyle = 'rgba(244,239,230,0.5)'; ctx.fillRect(bar.x, bar.y, 1, bar.h);
    const icons = [...document.querySelectorAll('.cat svg')].map(e => [e, { fill: 'none', stroke: '#f4efe6', 'stroke-width': '1.6', 'stroke-linecap': 'round', 'stroke-linejoin': 'round' }])
      .concat([...document.querySelectorAll('.social svg')].map(e => [e, { fill: '#f4efe6' }]));
    for (const [svg, attrs] of icons) {
      const r = rc(svg.getBoundingClientRect()), c = svg.cloneNode(true);
      c.setAttribute('xmlns', 'http://www.w3.org/2000/svg');
      c.setAttribute('width', Math.round(r.w * K)); c.setAttribute('height', Math.round(r.h * K));
      Object.entries(attrs).forEach(([a, v]) => c.setAttribute(a, v));
      const img = await loadImg('data:image/svg+xml;charset=utf-8,' + encodeURIComponent(new XMLSerializer().serializeToString(c)));
      ctx.drawImage(img, r.x, r.y, r.w, r.h);
    }
    ctx.restore();

    // downscale to the exact size
    const out = document.createElement('canvas'); out.width = W; out.height = H;
    const o = out.getContext('2d'); o.imageSmoothingEnabled = true; o.imageSmoothingQuality = 'high';
    o.drawImage(cv, 0, 0, W, H);
    return new Promise(res => out.toBlob(res, 'image/png'));
  }

  let lastBlob = null;
  $('dl').addEventListener('click', async () => {
    const btn = $('dl'); btn.textContent = 'Preparing…'; btn.disabled = true;
    try {
      lastBlob = await renderCard(SIZES[$('size').value]);
      $('resimg').src = URL.createObjectURL(lastBlob);
      $('result').classList.add('on');
    } catch (e) { alert('Could not create the image: ' + (e && e.message ? e.message : e)); }
    btn.textContent = 'Download PNG'; btn.disabled = false;
  });
  $('closeBtn').addEventListener('click', () => $('result').classList.remove('on'));
  $('shareBtn').addEventListener('click', async () => {
    if (!lastBlob) return;
    const file = new File([lastBlob], 'quote-card.png', { type: 'image/png' });
    if (navigator.canShare && navigator.canShare({ files: [file] })) { try { await navigator.share({ files: [file] }); return; } catch (e) { if (e && e.name === 'AbortError') return; } }
    const a = document.createElement('a'); a.href = URL.createObjectURL(lastBlob); a.download = 'quote-card-' + $('size').value + '.png'; document.body.appendChild(a); a.click(); a.remove();
  });
</script>
</body>
</html>
